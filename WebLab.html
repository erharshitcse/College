<html>
<head>
    <title>Student Entry Form</title>
</head>
<body>
<form>
<table>
<tr>
    <td>Name</td>
    <td><input type="text"></td>
</tr>
<tr>
    <td>Name in Hindi</td>
    <td><input type="text"></td>
</tr>
<tr>
    <td>Email</td>
    <td><input type="email"></td>
</tr>
<tr>
    <td>Address</td>
    <td><input type="text"></td>
</tr>
<tr>
    <td>Student Type</td>
    <td>
        <input type="radio" name="type"> Day Scholar
        <input type="radio" name="type"> Hosteler
    </td>
</tr>
<tr>
    <td>Languages Known</td>
    <td>
        <input type="checkbox"> Hindi
        <input type="checkbox"> English
        <input type="checkbox"> Sanskrit
        <input type="checkbox"> Other
    </td>
</tr>
<tr>
    <td>10th Percentage</td>
    <td><input type="number"></td>
</tr>
<tr>
    <td>12th Percentage</td>
    <td><input type="number"></td>
</tr>
<tr>
    <td>Physics Marks</td>
    <td><input type="number"></td>
</tr>
<tr>
    <td>Chemistry Marks</td>
    <td><input type="number"></td>
</tr>
<tr>
    <td>Mathematics Marks</td>
    <td><input type="number"></td>
</tr>
<tr>
    <td>Average (PCM)</td>
    <td><input type="text"></td>
</tr>
<tr>
    <td colspan="2">
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </td>
</tr>
</table>
</form>
</body>
</html>
